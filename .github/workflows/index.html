section{margin-top:clamp(4rem,10vw,7rem)}
h2{font-size:1.75rem;font-weight:700;margin-bottom:1.75rem;padding-left:1rem;border-left:6px solid var(--red)}

.skills li{background:var(--chip);border:2px solid var(--red);padding:.5rem 1.1rem;border-radius:999px;font-weight:500}

.project:last-child{border-bottom:1px solid var(--line)}

.project p{margin:.6rem 0 1rem;max-width:60ch}
